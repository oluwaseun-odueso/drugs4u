# Render Blueprint — Pharma4 PMS
# Docs: https://render.com/docs/blueprint-spec
#
# NOTE: Render does not offer a free MySQL tier.
# Use Railway (railway.app) for a free MySQL database.
# After creating it on Railway, paste the connection details
# as environment variables in the Render dashboard for pharma4-backend.

services:

  # ── PHP Backend ──────────────────────────────────────────────────────────────
  - type: web
    name: pharma4-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    envVars:
      # Set these in the Render dashboard after provisioning your MySQL DB
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      # Set FRONTEND_URL to your Render frontend URL once it is deployed
      - key: FRONTEND_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"

  # ── React Frontend ────────────────────────────────────────────────────────────
  - type: web
    name: pharma4-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # Set this to your pharma4-backend Render URL
      # e.g. https://pharma4-backend.onrender.com
      - key: VITE_API_URL
        sync: false
